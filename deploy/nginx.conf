# Reverse proxy nginx untuk janjipengharapan.com
#
# Pasang:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/janjipengharapan
#   sudo ln -s /etc/nginx/sites-available/janjipengharapan /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d janjipengharapan.com -d www.janjipengharapan.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name janjipengharapan.com www.janjipengharapan.com;

    # Certbot mengisi blok pengalihan ke HTTPS di sini saat pertama dijalankan.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name janjipengharapan.com www.janjipengharapan.com;

    # Baris ssl_certificate diisi otomatis oleh certbot.

    # Unggahan gambar dari admin panel lewat langsung ke Supabase, jadi batas
    # ini hanya perlu menampung payload form biasa.
    client_max_body_size 2m;

    # Kompresi
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Header keamanan
    add_header X-Content-Type-Options    "nosniff"                always;
    add_header X-Frame-Options           "SAMEORIGIN"             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Aset ber-hash dari Next.js — aman di-cache selamanya.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
